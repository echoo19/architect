<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Architect: a specialist for your organization, on your own computer</title>
    <meta
      name="description"
      content="A large model studies your organization's files and teaches a small one. The small model is tested on organizations it never saw, and the result runs on your computer."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#070707" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Architect" />
    <meta
      property="og:description"
      content="A specialist for your organization, on your own computer. A large model teaches a small one, and the result runs offline."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      // Motion is on only when scripts run and the visitor has not asked for less of it. Without
      // this class every chapter shows its finished picture, still. The computer's kind picks
      // which download button is the solid one, before anything paints, and whether the Windows
      // button goes straight to its installer.
      var root = document.documentElement;
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        root.classList.add('motion');
      }
      var platform =
        (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
      root.dataset.os = /mac|iphone|ipad/i.test(platform)
        ? 'mac'
        : /win/i.test(platform)
          ? 'windows'
          : 'other';
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
