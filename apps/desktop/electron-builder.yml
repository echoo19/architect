# Installers for Windows (NSIS) and macOS (DMG). Signing and notarization happen in CI, which
# provides the certificates through electron-builder's environment variables.
appId: io.github.echoo19.architect
productName: Architect
copyright: Copyright © 2026 Jake Kang

directories:
  output: release
  buildResources: build

# Package the Electron build installed for development and tests, so the shipped binary is the
# one the end-to-end tests ran against and packaging never downloads another. The version is
# stated because electron-builder looks for Electron only in this folder's node_modules, and the
# workspace hoists it to the root; keep it equal to the installed electron package. That folder
# holds one architecture's Electron, so a macOS build names the architecture it is for and, when
# it is not this machine's, points electronDist at the Electron for that one.
electronDist: ../../node_modules/electron/dist
electronVersion: 45.0.0

# electron-builder publishes and updates nothing here: the release workflow attaches the
# installers to a GitHub release itself. Left unset, a GH_TOKEN in the environment makes
# electron-builder look for a GitHub repository to publish to, and the build fails without one.
publish: null

# The bundles in out/ carry every dependency, so no node_modules ship with the app.
files:
  - out/**
  - package.json
  - '!node_modules/**'
npmRebuild: false

asar: true
# The engine and the agent host fork the tool sandbox as a Node process with the sandbox's
# folder as its working directory, so the sandbox and its WebAssembly live in a real folder
# beside the archive. The agent host itself, like the engine, runs from inside the archive.
# The architect command runs as plain Node (the app with ELECTRON_RUN_AS_NODE=1) from a real
# folder too, beside the sandbox it forks.
asarUnpack:
  - out/sandbox/**
  - out/cli/**

extraResources:
  - from: ../../examples/home-services/job
    to: sample-job
    filter:
      - job.json
      - tasks.jsonl
      - checker.js
      - data/**
  # Academy desk's job: its tasks, checker and the four academies' records (one it is never taught on).
  - from: ../../examples/academy/job
    to: academy-job
    filter:
      - job.json
      - tasks.jsonl
      - checker.js
      - orgs/**
  # Sweep desk's job: its tasks, checker and the four research groups' runs (one never seen).
  - from: ../../examples/sweep-desk/job
    to: sweep-desk-job
  # The Assay desk's job, a science lab sample: its tasks, checker and the four labs' files (one
  # it is never taught on).
  - from: ../../examples/assay-desk/job
    to: assay-job
    filter:
      - job.json
      - tasks.jsonl
      - checker.js
      - orgs/**
  # The ready-made agent: its package, and the records of the shop it was taught on. A build
  # without the package leaves it out (electron-builder only warns), and the app then doesn't
  # offer the agent.
  - from: ../../examples/gear-returns/graduate/returns-desk.architect.zip
    to: sample-agent/returns-desk.architect.zip
  - from: ../../examples/gear-returns/graduate/data
    to: sample-agent/data
  # The pinned training recipe and the scripts a training job runs; the engine sends them with
  # each job and reads the recipe to price it. `architect train bundle` copies the experimental
  # distributed trainer from experimental/.
  - from: ../../trainer
    to: trainer
    filter:
      - recipe.json
      - '*.py'
      - experimental/*.py

win:
  target: nsis
  # The architect command's launcher, beside Architect.exe (docs/CLI.md).
  extraFiles:
    - from: build/cli/architect.cmd
      to: architect.cmd

nsis:
  oneClick: true
  perMachine: false
  # No block map: nothing here updates the app in place.
  differentialPackage: false
  artifactName: ${productName}-Setup-${version}.${ext}

mac:
  # No architecture is named, so --arm64 or --x64 picks it, and a build without either is for
  # this machine's.
  target: dmg
  # The architect command's launcher, in Contents/Resources (docs/CLI.md).
  extraResources:
    - from: build/cli/architect
      to: architect
  category: public.app-category.productivity
  hardenedRuntime: true
  # Notarized with an App Store Connect API key from the environment; see scripts/release-mac.sh.
  notarize: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
