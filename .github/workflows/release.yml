name: Release

# One-time release recovery: ARM runner acquisition failed before any build step.
# Both artifact sources build the unchanged v0.9.2 application.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the artifact sources passed their build and packaging checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/echoo19/architect/actions/jobs/126802624358 --jq .conclusion)" = success
          test "$(gh run view 41897680152 --repo echoo19/architect --json conclusion --jq .conclusion)" = success
      - uses: actions/download-artifact@v8
        with:
          name: windows-installer
          run-id: 41895166997
          github-token: ${{ github.token }}
          path: installers
      - uses: actions/download-artifact@v8
        with:
          name: macos-installers
          run-id: 41897680152
          github-token: ${{ github.token }}
          path: installers
      - name: Attach the three installers to the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view v0.9.2 --repo echoo19/architect --json isDraft --jq .isDraft)" = true
          gh release upload v0.9.2 \
            installers/Architect-Setup-0.9.2.exe \
            installers/Architect-0.9.2-arm64.dmg \
            installers/Architect-0.9.2-x64.dmg \
            --repo echoo19/architect --clobber
